# One PVC per iSCSI target. Add as many blocks as you need.
# Each PVC maps to one IQN via the indexed env vars in 03-deployment.yaml:
#   BLOCK_DEVICE_N / IQN_N / TARGET_NAME_N
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-vol-1
  namespace: iscsi-target
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block          # raw block — not a filesystem
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-vol-2
  namespace: iscsi-target
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Gi
