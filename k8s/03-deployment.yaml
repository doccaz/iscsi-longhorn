apiVersion: apps/v1
kind: Deployment
metadata:
  name: iscsi-target
  namespace: iscsi-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iscsi-target
  template:
    metadata:
      labels:
        app: iscsi-target
    spec:
      # Uses the host network so port 3260 is exposed directly on the node IP.
      # External hosts connect to whichever node this pod is scheduled on.
      hostNetwork: true
      hostPID: false

      # Optional: pin to a specific node for a stable, predictable IP.
      # If omitted, the pod can land on any node (and move on failure).
      # nodeSelector:
      #   kubernetes.io/hostname: harvester-node-1

      # Give the pod enough time to cleanly tear down the iSCSI target
      terminationGracePeriodSeconds: 30

      containers:
      - name: iscsi-target
        image: your-registry/iscsi-target:latest   # ← replace with your image
        imagePullPolicy: Always

        securityContext:
          privileged: true   # required: modprobe + configfs access

        env:
        - name: BLOCK_DEVICE
          value: /dev/iscsi-vol
        - name: IQN
          value: iqn.2024-01.com.example:harvester-target   # ← customise
        - name: TARGET_NAME
          value: harvester-vol

        # Uncomment to enable CHAP authentication.
        # Create the secret first:
        #   kubectl create secret generic iscsi-chap -n iscsi-target \
        #     --from-literal=username=myuser --from-literal=password=mypassword
        #
        # - name: CHAP_USERID
        #   valueFrom:
        #     secretKeyRef:
        #       name: iscsi-chap
        #       key: username
        # - name: CHAP_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: iscsi-chap
        #       key: password

        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi

        # configfs is how userspace (targetcli) talks to the kernel LIO subsystem
        volumeMounts:
        - name: configfs
          mountPath: /sys/kernel/config

        # The Longhorn block device is presented as a raw device inside the container
        volumeDevices:
        - name: data
          devicePath: /dev/iscsi-vol

      volumes:
      - name: configfs
        hostPath:
          path: /sys/kernel/config
          type: DirectoryOrCreate

      - name: data
        persistentVolumeClaim:
          claimName: iscsi-target-vol
