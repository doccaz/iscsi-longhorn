apiVersion: apps/v1
kind: Deployment
metadata:
  name: iscsi-target
  namespace: iscsi-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iscsi-target
  template:
    metadata:
      labels:
        app: iscsi-target
    spec:
      # Uses the host network so port 3260 is exposed directly on the node IP.
      hostNetwork: true
      hostPID: false

      # Optional: pin to a specific node for a stable, predictable IP.
      # nodeSelector:
      #   kubernetes.io/hostname: harvester-node-1

      terminationGracePeriodSeconds: 30

      containers:
      - name: iscsi-target
        image: your-registry/iscsi-target:latest   # ← replace with your image
        imagePullPolicy: Always

        securityContext:
          privileged: true   # required: modprobe + configfs access

        # ── Multi-target mapping ──────────────────────────────────────────────
        # Each numbered group (BLOCK_DEVICE_N / IQN_N / TARGET_NAME_N) maps one
        # Longhorn PVC (volumeDevices below) to one iSCSI IQN.
        # Add or remove groups to match the number of PVCs you defined in 02-pvc.yaml.
        env:
        - name: BLOCK_DEVICE_1
          value: /dev/iscsi-vol-1
        - name: IQN_1
          value: iqn.2024-01.com.example:target-1   # ← customise
        - name: TARGET_NAME_1
          value: vol-1

        - name: BLOCK_DEVICE_2
          value: /dev/iscsi-vol-2
        - name: IQN_2
          value: iqn.2024-01.com.example:target-2   # ← customise
        - name: TARGET_NAME_2
          value: vol-2

        # Uncomment to enable CHAP authentication (applies to all targets).
        # Create the secret first:
        #   kubectl create secret generic iscsi-chap -n iscsi-target \
        #     --from-literal=username=myuser --from-literal=password=mypassword
        #
        # - name: CHAP_USERID
        #   valueFrom:
        #     secretKeyRef:
        #       name: iscsi-chap
        #       key: username
        # - name: CHAP_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: iscsi-chap
        #       key: password

        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi

        volumeMounts:
        - name: configfs
          mountPath: /sys/kernel/config

        # One entry per PVC — devicePath must match BLOCK_DEVICE_N above.
        volumeDevices:
        - name: data-1
          devicePath: /dev/iscsi-vol-1
        - name: data-2
          devicePath: /dev/iscsi-vol-2

      volumes:
      - name: configfs
        hostPath:
          path: /sys/kernel/config
          type: DirectoryOrCreate

      # One entry per PVC — claimName must match a PVC from 02-pvc.yaml.
      - name: data-1
        persistentVolumeClaim:
          claimName: iscsi-vol-1
      - name: data-2
        persistentVolumeClaim:
          claimName: iscsi-vol-2
